[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bin-sentry-agent"
version = "0.4.0"
description = "Binary vulnerability analysis agent for firmware Web/CGI targets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "streamlit>=1.52,<2",
    "uvicorn>=0.32,<1",
]

[project.scripts]
vulnagent = "vulnagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vulnagent*"]

[tool.setuptools.package-data]
"vulnagent.skills" = ["SKILL.md"]
"vulnagent.skills.discovery" = ["SKILL.md"]
"vulnagent.skills.validation" = ["SKILL.md"]
"vulnagent.skills.intel_report" = ["SKILL.md"]
"vulnagent.skills.firmware_web_audit" = ["SKILL.md"]
